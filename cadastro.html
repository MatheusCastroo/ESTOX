<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Estocx</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ============================================
           DESIGN MODERNO E MINIMALISTA - CADASTRO
           ============================================ */
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            background: #f8fafc;
        }
        
        .bg-light {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        
        /* Container centralizado */
        .container {
            max-width: 1200px;
        }
        
        /* Card moderno */
        .card {
            border: 0 !important;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            background: #ffffff;
            overflow: hidden;
        }
        
        .card-body {
            padding: 2.5rem !important;
        }
        
        /* Logo Container - CRÍTICO: Não pode quebrar */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0;
            min-height: 70px;
        }
        
        .logo-container a {
            display: inline-flex;
            align-items: center;
            gap: 0.875rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }
        
        .logo-container a:hover {
            transform: scale(1.02);
        }
        
        .logo-container i {
            font-size: 2.25rem;
            color: #0D47A1;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        
        .logo-container span {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
        }
        
        /* Título e subtítulo */
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-header h2 {
            color: #1e293b;
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 0.375rem;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }
        
        .form-header p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin: 0;
            font-weight: 400;
            line-height: 1.5;
        }
        
        /* Form Labels */
        .form-label {
            font-weight: 600;
            font-size: 0.8125rem;
            color: #334155;
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
            line-height: 1.4;
        }
        
        .form-label i {
            color: #94a3b8;
            margin-right: 0.5rem;
            font-size: 0.875rem;
            opacity: 0.7;
            vertical-align: -0.05em;
        }
        
        /* Inputs modernos */
        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
            background-color: #ffffff;
            color: #1e293b;
            height: 44px;
            line-height: 1.5;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #0D47A1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.08);
            outline: none;
            background-color: #ffffff;
        }
        
        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        
        .form-control:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .form-select {
            padding-right: 2.5rem;
        }
        
        /* Input group para senha */
        .input-group .form-control {
            border-right: none;
            border-radius: 8px 0 0 8px;
        }
        
        .input-group .btn {
            border: 1.5px solid #e2e8f0;
            border-left: none;
            border-radius: 0 8px 8px 0;
            background: #ffffff;
            color: #94a3b8;
            transition: all 0.2s ease;
            padding: 0.75rem 0.875rem;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-group .form-control:focus + .btn {
            border-color: #0D47A1;
        }
        
        .input-group .btn:hover {
            background: #f8fafc;
            color: #64748b;
        }
        
        .input-group .btn:focus {
            box-shadow: none;
        }
        
        .input-group .btn i {
            font-size: 1rem;
            opacity: 0.7;
        }
        
        /* Botão primário */
        .btn-primary {
            background: linear-gradient(135deg, #0D47A1 0%, #1565C0 100%);
            border: none;
            border-radius: 8px;
            padding: 0.8125rem 1.5rem;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(13, 71, 161, 0.12);
            letter-spacing: 0.01em;
            height: 44px;
            min-height: 44px;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #1565C0 0%, #1976D2 100%);
            box-shadow: 0 3px 10px rgba(13, 71, 161, 0.2);
            transform: translateY(-1px);
        }
        
        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(13, 71, 161, 0.15);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .text-primary {
            color: #0D47A1 !important;
        }
        
        /* Checkbox moderno */
        .form-check-input {
            border: 1.5px solid #e2e8f0;
            border-radius: 4px;
            width: 1.125rem;
            height: 1.125rem;
            margin-top: 0.25rem;
            transition: all 0.2s ease;
        }
        
        .form-check-input:checked {
            background-color: #0D47A1;
            border-color: #0D47A1;
        }
        
        .form-check-input:focus {
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }
        
        .form-check-label {
            font-size: 0.8125rem;
            color: #64748b;
            line-height: 1.5;
        }
        
        .form-check-label a {
            color: #0D47A1;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .form-check-label a:hover {
            color: #1565C0;
            text-decoration: underline;
        }
        
        /* Links */
        a.text-decoration-none {
            color: #64748b;
            font-weight: 500;
            transition: color 0.2s ease;
            font-size: 0.875rem;
        }
        
        a.text-decoration-none:hover {
            color: #0D47A1;
            text-decoration: underline;
        }
        
        .auth-footer a.text-decoration-none {
            color: #0D47A1;
            font-weight: 600;
        }
        
        .auth-footer a.text-decoration-none:hover {
            color: #1565C0;
            text-decoration: underline;
        }
        
        /* Alert */
        .alert {
            border-radius: 10px;
            border: none;
            font-size: 0.875rem;
            padding: 0.875rem 1.125rem;
        }
        
        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
        }
        
        /* Espaçamento entre campos */
        .mb-3 {
            margin-bottom: 1rem !important;
        }
        
        .mb-4 {
            margin-bottom: 1.5rem !important;
        }
        
        /* Link de cadastro/login */
        .auth-footer {
            text-align: center;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .auth-footer .text-muted {
            color: #94a3b8;
            font-size: 0.8125rem;
        }
        
        /* Responsividade Desktop */
        @media (min-width: 992px) {
            .bg-light {
                padding: 2.5rem 0;
            }
            
            .card-body {
                padding: 2.75rem !important;
            }
        }
        
        /* Responsividade Tablet */
        @media (max-width: 991px) and (min-width: 768px) {
            .card-body {
                padding: 2.5rem !important;
            }
        }
        
        /* Responsividade Mobile */
        @media (max-width: 767px) {
            body {
                overflow-y: auto;
            }
            
            .bg-light {
                padding: 1rem 0;
                min-height: 100vh;
            }
            
            .card {
                border-radius: 12px;
                margin: 0 0.75rem;
            }
            
            .card-body {
                padding: 1.75rem 1.25rem !important;
            }
            
            .logo-container {
                margin-bottom: 1.25rem;
                min-height: 60px;
            }
            
            .logo-container i {
                font-size: 1.875rem;
            }
            
            .logo-container span {
                font-size: 1.5rem;
            }
            
            .form-header {
                margin-bottom: 1.5rem;
            }
            
            .form-header h2 {
                font-size: 1.5rem;
                margin-bottom: 0.375rem;
            }
            
            .form-header p {
                font-size: 0.8125rem;
            }
            
            .form-label {
                font-size: 0.8125rem;
                margin-bottom: 0.5rem;
            }
            
            .form-control, .form-select {
                padding: 0.75rem 1rem;
                font-size: 0.9375rem;
                height: 44px;
            }
            
            .input-group .btn {
                padding: 0.75rem 0.75rem;
                height: 44px;
            }
            
            .btn-primary {
                padding: 0.8125rem 1.25rem;
                font-size: 0.9375rem;
                height: 44px;
            }
            
            .mb-3 {
                margin-bottom: 1rem !important;
            }
            
            .mb-4 {
                margin-bottom: 1.25rem !important;
            }
            
            .auth-footer {
                margin-top: 1rem;
                padding-top: 1rem;
            }
        }
        
        /* Garantir que não haja overflow horizontal */
        * {
            box-sizing: border-box;
        }
        
        .row {
            margin-left: 0;
            margin-right: 0;
        }
        
        [class*="col-"] {
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="card shadow-lg border-0">
                    <div class="card-body">
                        <div class="logo-container">
                            <a href="index.html" class="text-decoration-none">
                                <i class="bi bi-car-front"></i>
                                <span>Estocx</span>
                            </a>
                        </div>
                        
                        <div class="form-header">
                            <h2>Criar sua conta</h2>
                            <p>Preencha os dados abaixo para começar o teste grátis</p>
                        </div>

                        <form id="registerForm">
                            <!-- Dados da loja -->
                            <div class="row">
                                <div class="col-md-6 mb-3">  
                                    <label for="storeName" class="form-label">
                                        <i class="bi bi-shop me-1"></i>Nome da loja
                                    </label>
                                    <input type="text" class="form-control" id="storeName" placeholder="Ex: Auto Prime Veículos" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">
                                        <i class="bi bi-person me-1"></i>Seu nome
                                    </label>
                                    <input type="text" class="form-control" id="name" placeholder="Nome completo" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">
                                        <i class="bi bi-envelope me-1"></i>E-mail
                                    </label>
                                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">
                                        <i class="bi bi-whatsapp me-1"></i>WhatsApp
                                    </label>
                                    <input type="tel" class="form-control" id="phone" placeholder="(11) 99999-9999" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock me-1"></i>Senha
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePasswordRegister">
                                        <i class="bi bi-eye" id="eyeIconRegister"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Localização -->
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label for="city" class="form-label">
                                        <i class="bi bi-geo-alt me-1"></i>Cidade
                                    </label>
                                    <input type="text" class="form-control" id="city" placeholder="São Paulo" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="state" class="form-label">
                                        <i class="bi bi-map me-1"></i>Estado
                                    </label>
                                    <select id="state" class="form-select" required>
                                        <option value="" selected disabled>Selecione</option>
                                        <option value="SP">SP</option>
                                        <option value="RJ">RJ</option>
                                        <option value="MG">MG</option>
                                        <option value="RS">RS</option>
                                        <option value="PR">PR</option>
                                        <option value="SC">SC</option>
                                        <option value="BA">BA</option>
                                        <option value="GO">GO</option>
                                        <option value="DF">DF</option>
                                        <option value="ES">ES</option>
                                        <option value="PE">PE</option>
                                        <option value="CE">CE</option>
                                        <option value="PA">PA</option>
                                        <option value="MA">MA</option>
                                        <option value="AM">AM</option>
                                        <option value="MT">MT</option>
                                        <option value="MS">MS</option>
                                        <option value="PB">PB</option>
                                        <option value="RN">RN</option>
                                        <option value="AL">AL</option>
                                        <option value="PI">PI</option>
                                        <option value="SE">SE</option>
                                        <option value="RO">RO</option>
                                        <option value="TO">TO</option>
                                        <option value="AC">AC</option>
                                        <option value="AP">AP</option>
                                        <option value="RR">RR</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Plano (oculto, sempre Profissional) -->
                            <input type="hidden" id="plan" value="profissional">

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    Li e aceito os <a href="#" class="text-decoration-none">Termos de Uso</a> e a 
                                    <a href="#" class="text-decoration-none">Política de Privacidade</a>.
                                </label>
                            </div>

                            <div id="registerError" class="alert alert-danger d-none mb-3" role="alert"></div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" id="registerSubmitBtn">
                                <span class="spinner-border spinner-border-sm d-none me-2" id="registerSpinner"></span>
                                Criar conta
                            </button>
                        </form>

                        <div class="auth-footer">
                            <span class="text-muted">Já tem uma conta?</span>
                            <a href="login.html" class="text-decoration-none fw-bold ms-1">Entrar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Define API_URL inline as fallback (before loading config.js) -->
    <script>
        // Fallback: Define API_URL inline in case config.js doesn't load
        // This ensures API_URL is available even if config.js returns 404
        (function() {
            var hostname = window.location.hostname;
            var protocol = window.location.protocol;
            var apiUrl;
            
            // Check if running on Hostinger or production domain
            if (hostname !== 'localhost' && hostname !== '127.0.0.1' && !hostname.startsWith('192.168.')) {
                // Production (Hostinger) - detecta automaticamente o domínio
                apiUrl = protocol + '//' + hostname + '/api';
            } else {
                // Development (Localhost)
                apiUrl = 'http://localhost/ESTOX/api';
            }
            
            // Store in window object first
            window.API_URL = apiUrl;
            console.log('API_URL definida (fallback inline) como window.API_URL:', apiUrl);
        })();
    </script>
    
    <!-- Make API_URL available as global const (will be redefined by config.js if it loads) -->
    <script>
        // Create API_URL in global scope from window.API_URL for auth.js compatibility
        // This runs before config.js loads, so if config.js loads, it will redefine API_URL
        var API_URL = window.API_URL;
    </script>
    
    <!-- Custom JS - config.js will override API_URL if it loads, otherwise fallback is used -->
    <script src="assets/js/config.js" onerror="console.warn('config.js não carregou, usando fallback inline')"></script>
    <script src="assets/js/mobile.js"></script>
    <script src="assets/js/auth.js" onerror="console.error('auth.js não carregou!')"></script>
    
    <!-- Verify scripts loaded -->
    <script>
        // Verify critical scripts loaded
        window.addEventListener('DOMContentLoaded', function() {
            // Check if API_URL is defined (either from config.js or fallback)
            if (typeof window.API_URL === 'undefined' && typeof API_URL === 'undefined') {
                console.error('⚠️ ERRO CRÍTICO: API_URL não está definida!');
                console.error('Tanto config.js quanto o fallback inline falharam.');
                const errorDiv = document.getElementById('registerError');
                if (errorDiv) {
                    errorDiv.innerHTML = '<strong>Erro:</strong> Arquivos JavaScript não carregaram. <br>Verifique o console (F12) para detalhes. <br><small>Tentando carregar: assets/js/config.js e assets/js/auth.js</small>';
                    errorDiv.classList.remove('d-none');
                }
            } else {
                const apiUrl = window.API_URL || API_URL;
                console.log('✅ API_URL disponível:', apiUrl);
            }
        });
    </script>
</body>
</html>
