<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AutoStock</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-lg-6">
                <div class="mb-4 text-center text-lg-start">
                    <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
                        <i class="bi bi-car-front fs-2 text-primary"></i>
                        <span class="fs-4 fw-bold text-dark">AutoStock</span>
                    </a>
                    <p class="text-muted mb-0">
                        Crie sua conta e comece a gerenciar o estoque de veículos da sua loja em poucos minutos.
                    </p>
                </div>
            </div>

            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Criar sua conta</h2>
                            <p class="text-muted mb-0">Preencha os dados abaixo para começar o teste grátis</p>
                        </div>

                        <form id="registerForm">
                            <!-- Dados da loja -->
                            <div class="mb-3">  
                                <label for="storeName" class="form-label">Nome da loja</label>
                                <input type="text" class="form-control" id="storeName" placeholder="Ex: Auto Prime Veículos" required>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Seu nome</label>
                                <input type="text" class="form-control" id="name" placeholder="Nome completo" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">WhatsApp</label>
                                <input type="tel" class="form-control" id="phone" placeholder="(11) 99999-9999" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePasswordRegister">
                                        <i class="bi bi-eye" id="eyeIconRegister"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Localização -->
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label for="city" class="form-label">Cidade</label>
                                    <input type="text" class="form-control" id="city" placeholder="São Paulo" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="state" class="form-label">Estado</label>
                                    <select id="state" class="form-select" required>
                                        <option value="" selected disabled>Selecione</option>
                                        <option value="SP">SP</option>
                                        <option value="RJ">RJ</option>
                                        <option value="MG">MG</option>
                                        <option value="RS">RS</option>
                                        <option value="PR">PR</option>
                                        <option value="SC">SC</option>
                                        <option value="BA">BA</option>
                                        <option value="GO">GO</option>
                                        <option value="DF">DF</option>
                                        <option value="ES">ES</option>
                                        <option value="PE">PE</option>
                                        <option value="CE">CE</option>
                                        <option value="PA">PA</option>
                                        <option value="MA">MA</option>
                                        <option value="AM">AM</option>
                                        <option value="MT">MT</option>
                                        <option value="MS">MS</option>
                                        <option value="PB">PB</option>
                                        <option value="RN">RN</option>
                                        <option value="AL">AL</option>
                                        <option value="PI">PI</option>
                                        <option value="SE">SE</option>
                                        <option value="RO">RO</option>
                                        <option value="TO">TO</option>
                                        <option value="AC">AC</option>
                                        <option value="AP">AP</option>
                                        <option value="RR">RR</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Plano (simples, só para visual) -->
                            <div class="mb-3">
                                <label for="plan" class="form-label">Plano</label>
                                <select id="plan" class="form-select" required>
                                    <option value="basico">Básico – R$ 97/mês</option>
                                    <option value="profissional" selected>Profissional – R$ 197/mês</option>
                                    <option value="enterprise">Enterprise – Sob consulta</option>
                                </select>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    Li e aceito os <a href="#" class="text-decoration-none">Termos de Uso</a> e a 
                                    <a href="#" class="text-decoration-none">Política de Privacidade</a>.
                                </label>
                            </div>

                            <div id="registerError" class="alert alert-danger d-none" role="alert"></div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" id="registerSubmitBtn">
                                <span class="spinner-border spinner-border-sm d-none me-2" id="registerSpinner"></span>
                                Criar conta
                            </button>
                        </form>

                        <div class="text-center text-muted">
                            Já tem uma conta?
                            <a href="login.html" class="text-decoration-none fw-bold">Entrar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- WhatsApp Float Button -->
    <a href="https://wa.me/5544988611075" 
       class="whatsapp-float" 
       target="_blank" 
       rel="noopener noreferrer"
       aria-label="Fale conosco no WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS (pode ser o mesmo de auth ou outro específico de cadastro) -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
