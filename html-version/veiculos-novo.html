<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Veículo - AutoStock</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <i class="bi bi-car-front fs-4"></i>
                <span class="fw-bold">AutoStock</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-1"></i>Sair
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i>Veículos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="veiculos-novo.html">
                            <i class="bi bi-plus-circle me-2"></i>Novo Veículo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="leads.html">
                            <i class="bi bi-people me-2"></i>Leads
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="relatorios.html">
                            <i class="bi bi-bar-chart me-2"></i>Relatórios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="configuracoes.html">
                            <i class="bi bi-gear me-2"></i>Configurações
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
                <div class="mb-4">
                    <h1 class="h3 fw-bold">Novo Veículo</h1>
                    <p class="text-muted mb-0">Cadastre um novo veículo no seu estoque</p>
                </div>

                <form id="newVehicleForm">
                    <div class="row g-4">
                        <div class="col-lg-8">
                            <!-- Basic Info -->
                            <div class="card mb-4">
                                <div class="card-header bg-white">
                                    <h5 class="fw-bold mb-0">Informações Básicas</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="brand" class="form-label">Marca</label>
                                            <select class="form-select" id="brand" required>
                                                <option value="">Selecione a marca</option>
                                                <option value="Toyota">Toyota</option>
                                                <option value="Honda">Honda</option>
                                                <option value="Volkswagen">Volkswagen</option>
                                                <option value="Fiat">Fiat</option>
                                                <option value="Chevrolet">Chevrolet</option>
                                                <option value="Ford">Ford</option>
                                                <option value="Jeep">Jeep</option>
                                                <option value="Nissan">Nissan</option>
                                                <option value="Hyundai">Hyundai</option>
                                                <option value="Renault">Renault</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="model" class="form-label">Modelo</label>
                                            <input type="text" class="form-control" id="model" placeholder="Ex: Civic Touring" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="year" class="form-label">Ano</label>
                                            <select class="form-select" id="year" required>
                                                <option value="">Ano</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="mileage" class="form-label">Quilometragem</label>
                                            <input type="number" class="form-control" id="mileage" placeholder="Ex: 50000" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="price" class="form-label">Preço (R$)</label>
                                            <input type="number" class="form-control" id="price" placeholder="Ex: 150000" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="fuel" class="form-label">Combustível</label>
                                            <select class="form-select" id="fuel" required>
                                                <option value="">Selecione</option>
                                                <option value="Flex">Flex</option>
                                                <option value="Gasolina">Gasolina</option>
                                                <option value="Etanol">Etanol</option>
                                                <option value="Diesel">Diesel</option>
                                                <option value="Híbrido">Híbrido</option>
                                                <option value="Elétrico">Elétrico</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="transmission" class="form-label">Câmbio</label>
                                            <select class="form-select" id="transmission" required>
                                                <option value="">Selecione</option>
                                                <option value="Automático">Automático</option>
                                                <option value="Manual">Manual</option>
                                                <option value="CVT">CVT</option>
                                                <option value="Automatizado">Automatizado</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="color" class="form-label">Cor</label>
                                            <input type="text" class="form-control" id="color" placeholder="Ex: Prata" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="card mb-4">
                                <div class="card-header bg-white">
                                    <h5 class="fw-bold mb-0">Descrição</h5>
                                </div>
                                <div class="card-body">
                                    <textarea class="form-control" id="description" rows="4" placeholder="Descreva o veículo, condições, diferenciais..."></textarea>
                                </div>
                            </div>

                            <!-- Features -->
                            <div class="card mb-4">
                                <div class="card-header bg-white">
                                    <h5 class="fw-bold mb-0">Opcionais</h5>
                                </div>
                                <div class="card-body">
                                    <div class="input-group mb-3">
                                        <input type="text" class="form-control" id="newFeature" placeholder="Ex: Couro, Teto Solar, Multimídia...">
                                        <button type="button" class="btn btn-outline-primary" onclick="addFeature()">Adicionar</button>
                                    </div>
                                    <div id="featuresList" class="d-flex flex-wrap gap-2"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <!-- Images -->
                            <div class="card mb-4">
                                <div class="card-header bg-white">
                                    <h5 class="fw-bold mb-0">Fotos</h5>
                                </div>
                                <div class="card-body">
                                    <div class="border-2 border-dashed rounded p-4 text-center">
                                        <i class="bi bi-cloud-upload fs-1 text-muted mb-3"></i>
                                        <p class="text-muted small mb-2">Arraste imagens ou clique para fazer upload</p>
                                        <input type="file" class="form-control" id="imagesInput" multiple accept="image/*">
                                    </div>
                                    <div id="imagesPreview" class="row g-2 mt-3"></div>
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="card mb-4">
                                <div class="card-header bg-white">
                                    <h5 class="fw-bold mb-0">Status</h5>
                                </div>
                                <div class="card-body">
                                    <select class="form-select" id="status">
                                        <option value="available">Disponível</option>
                                        <option value="reserved">Reservado</option>
                                        <option value="sold">Vendido</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-2"></i>Salvar Veículo
                                </button>
                                <a href="veiculos.html" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-2"></i>Cancelar
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/new-vehicle.js"></script>
</body>
</html>
