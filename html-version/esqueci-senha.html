<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - AutoStock</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0" id="forgotForm">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-car-front fs-1 text-primary mb-3"></i>
                            <h2 class="fw-bold">Esqueceu sua senha?</h2>
                            <p class="text-muted">Digite seu e-mail e enviaremos um link para redefinir sua senha</p>
                        </div>
                        
                        <form id="forgotPasswordForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                            </div>
                            
                            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                                <span class="spinner-border spinner-border-sm d-none me-2" id="spinner"></span>
                                Enviar link de recuperação
                            </button>
                        </form>
                        
                        <div class="text-center">
                            <a href="login.html" class="text-decoration-none d-inline-flex align-items-center gap-1">
                                <i class="bi bi-arrow-left"></i>
                                Voltar para o login
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Success message (hidden by default) -->
                <div class="card shadow-lg border-0 d-none" id="successMessage">
                    <div class="card-body p-5 text-center">
                        <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 64px; height: 64px;">
                            <i class="bi bi-check-circle fs-1 text-success"></i>
                        </div>
                        <h2 class="fw-bold mb-2">E-mail enviado!</h2>
                        <p class="text-muted mb-4">
                            Se existe uma conta com este e-mail, você receberá um link para redefinir sua senha.
                        </p>
                        <a href="login.html" class="btn btn-primary">Voltar para o login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const errorAlert = document.getElementById('errorAlert');
            
            submitBtn.disabled = true;
            spinner.classList.remove('d-none');
            errorAlert.classList.add('d-none');
            
            // Simulate API call
            setTimeout(() => {
                document.getElementById('forgotForm').classList.add('d-none');
                document.getElementById('successMessage').classList.remove('d-none');
            }, 1500);
        });
    </script>
</body>
</html>
