<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - AutoStock</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-car-front fs-4 text-primary"></i>
                    <span class="fw-bold">AutoStock</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Voltar ao site</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <!-- Store Info -->
    <div class="bg-white border-bottom">
        <div class="container py-4">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <img id="storeLogo" src="" alt="Logo" class="d-none" style="max-height: 60px; max-width: 200px;">
                        <h1 class="h3 fw-bold mb-0" id="storeName">Carregando...</h1>
                    </div>
                    <p class="text-muted mb-2" id="storeDescription">Carregando informações da loja...</p>
                    <div class="text-muted small" id="storeContact">
                        <span id="storePhone" class="d-none"><i class="bi bi-telephone me-1"></i><span id="storePhoneNumber"></span></span>
                        <span id="storeAddress" class="d-none ms-3"><i class="bi bi-geo-alt me-1"></i><span id="storeAddressText"></span></span>
                    </div>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <a href="#" class="btn btn-success d-none" id="whatsappBtn" target="_blank">
                        <i class="bi bi-whatsapp me-2"></i>Falar no WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-white border-bottom py-3">
        <div class="container">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="searchInput" placeholder="Buscar veículo...">
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="brandFilter">
                        <option value="">Todas as marcas</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" id="minYear" placeholder="Ano mín.">
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" id="maxYear" placeholder="Ano máx.">
                </div>
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" class="form-control" id="maxPrice" placeholder="Preço máx.">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vehicles Grid -->
    <div class="container py-5">
        <div id="vehiclesGrid" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 AutoStock. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- WhatsApp Float Button -->
    <a href="https://wa.me/5544988611075" 
       class="whatsapp-float" 
       target="_blank" 
       rel="noopener noreferrer"
       aria-label="Fale conosco no WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/catalog.js"></script>
</body>
</html>
