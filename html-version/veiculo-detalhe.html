<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Veículo - AutoStock</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-car-front fs-4 text-primary"></i>
                    <span class="fw-bold">AutoStock</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <div id="vehicleContent" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 AutoStock. Todos os direitos reservados.</p>
            <p class="text-muted small mb-0 mt-2">Powered by <strong>ESTOX</strong></p>
        </div>
    </footer>

    <!-- WhatsApp Float Button - Will be set dynamically by JS -->
    <a href="#" 
       class="whatsapp-float d-none" 
       id="whatsappFloat"
       target="_blank" 
       rel="noopener noreferrer"
       aria-label="Fale conosco no WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/vehicle-detail.js"></script>
</body>
</html>
