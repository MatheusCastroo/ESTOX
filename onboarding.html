<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Loja - Estocx</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center py-5">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                                <i class="bi bi-car-front fs-2 text-primary"></i>
                            </div>
                            <h2 class="fw-bold">Configure sua loja</h2>
                            <p class="text-muted">Preencha as informações da sua loja para começar a usar o Estocx</p>
                        </div>
                        
                        <form id="onboardingForm">
                            <div class="mb-3">
                                <label for="storeName" class="form-label">Nome da Loja <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="storeName" placeholder="Ex: Auto Prime Veículos" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="slug" class="form-label">URL do Catálogo <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">estocx.com.br/</span>
                                    <input type="text" class="form-control" id="slug" placeholder="sua-loja" required 
                                           pattern="[a-z0-9-]+" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                                    <span class="input-group-text" id="slugStatus"></span>
                                </div>
                                <small class="text-muted">Apenas letras minúsculas, números e hífens</small>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Telefone</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="(11) 3333-3333">
                                </div>
                                <div class="col-md-6">
                                    <label for="whatsapp" class="form-label">WhatsApp <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="whatsapp" placeholder="(11) 99999-9999" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Descrição da Loja</label>
                                <textarea class="form-control" id="description" rows="4" 
                                          placeholder="Conte um pouco sobre sua loja, tempo de mercado, diferenciais..."></textarea>
                            </div>
                            
                            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
                            
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                                <span class="spinner-border spinner-border-sm d-none me-2" id="spinner"></span>
                                Criar Loja e Começar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/mobile.js"></script>
    <script>
        // API_URL is defined in config.js
        
        // Auto-generate slug from store name
        document.getElementById('storeName').addEventListener('input', function() {
            const storeName = this.value;
            const slug = storeName
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            document.getElementById('slug').value = slug;
            checkSlugAvailability(slug);
        });
        
        // Check slug availability
        let slugCheckTimeout;
        document.getElementById('slug').addEventListener('input', function() {
            const slug = this.value;
            clearTimeout(slugCheckTimeout);
            slugCheckTimeout = setTimeout(() => checkSlugAvailability(slug), 500);
        });
        
        async function checkSlugAvailability(slug) {
            if (!slug) {
                document.getElementById('slugStatus').innerHTML = '';
                return;
            }
            
            const statusEl = document.getElementById('slugStatus');
            statusEl.innerHTML = '<span class="spinner-border spinner-border-sm text-primary"></span>';
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/stores?check_slug=${encodeURIComponent(slug)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.data.available) {
                    statusEl.innerHTML = '<i class="bi bi-check-circle text-success"></i>';
                } else {
                    statusEl.innerHTML = '<i class="bi bi-x-circle text-danger"></i>';
                }
            } catch (error) {
                statusEl.innerHTML = '';
            }
        }
        
        // Form submission
        document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const errorAlert = document.getElementById('errorAlert');
            
            submitBtn.disabled = true;
            spinner.classList.remove('d-none');
            errorAlert.classList.add('d-none');
            
            try {
                const token = localStorage.getItem('token');
                const urlParams = new URLSearchParams(window.location.search);
                const planSlug = urlParams.get('plan') || 'profissional';
                
                const response = await fetch(`${API_URL}/stores`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: document.getElementById('storeName').value,
                        slug: document.getElementById('slug').value,
                        phone: document.getElementById('phone').value,
                        whatsapp: document.getElementById('whatsapp').value.replace(/\D/g, ''),
                        description: document.getElementById('description').value,
                        plan_slug: planSlug
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    Toast.success('Loja configurada com sucesso!');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    errorAlert.textContent = data.error || 'Erro ao criar loja';
                    errorAlert.classList.remove('d-none');
                    Toast.error(data.error || 'Erro ao criar loja');
                }
            } catch (error) {
                errorAlert.textContent = 'Erro de conexão. Tente novamente.';
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>

</body>
</html>
